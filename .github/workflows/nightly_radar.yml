name: Nightly Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e .[dev]
      - name: Generate offline mock radar
        run: python -m hackathon_hunter collect --mock --online-only --min-prize-usd 1000
      - name: Check rules
        run: python -m hackathon_hunter check-rules --input data/processed/mock_hackathons.json
