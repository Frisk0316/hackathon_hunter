name: Nightly Radar

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e .[dev]
      - name: Deadline watch
        run: |
          set +e
          python -m hackathon_hunter watch
          watch_exit=$?
          cat reports/watch_*.md >> "$GITHUB_STEP_SUMMARY"
          exit "$watch_exit"
